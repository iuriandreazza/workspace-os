name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint and boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-arm

      # rustup reads rust-toolchain.toml and installs the pinned toolchain,
      # target and components.
      - name: Install Rust toolchain
        run: rustup show

      - name: Run checks
        run: ./scripts/check.sh
