name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint and boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # qemu-efi-aarch64: the UEFI firmware the bootloader boot runs on.
      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-arm qemu-efi-aarch64

      # Without arguments rustup installs what rust-toolchain.toml pins, and
      # fails the step if it cannot.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Run checks
        run: ./scripts/check.sh
