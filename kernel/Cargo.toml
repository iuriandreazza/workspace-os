[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[lints]
workspace = true

[dependencies]
bootinfo = { path = "../bootinfo" }
devicetree = { path = "../devicetree" }
kernelheap = { path = "../kernelheap" }
kernelvm = { path = "../kernelvm" }
physmem = { path = "../physmem" }

# Each feature makes the kernel raise an exception nothing handles, so the boot
# smoke test can check that it still ends in a kernel panic.
[features]
selftest-unhandled-class = []
selftest-unhandled-vector = []
selftest-compiler-trap = []
# Each of these provokes one violation of write-xor-execute that must end in a
# reported fault (ADR 0019).
selftest-write-text = []
selftest-execute-data = []
selftest-execute-rodata = []
# The boot stack overflows and the report must leave `.bss` whole (ADR 0026).
selftest-stack-overflow = []
# An exception taken by the exception handler itself must be reported as
# nested, not handled on the same stack again (ADR 0026).
selftest-nested-exception = []
# Sets `TCR2_EL1.PIE` just before the code that clears it, which stands for
# firmware that left it set (ADR 0026).
selftest-dirty-tcr2 = []
# Takes memory from the heap until it refuses, then frees it all: the refusal
# must be reported and the heap must work again (ADR 0029).
selftest-heap-exhaustion = []

[[bin]]
name = "kernel"
path = "src/main.rs"
# The std test harness cannot link into a bare-metal binary.
test = false
bench = false
