[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[lints]
workspace = true

# Each feature makes the kernel raise an exception nothing handles, so the boot
# smoke test can check that it still ends in a kernel panic.
[features]
selftest-unhandled-class = []
selftest-unhandled-vector = []

[[bin]]
name = "kernel"
path = "src/main.rs"
# The std test harness cannot link into a bare-metal binary.
test = false
bench = false
