[workspace]
members = ["kernel", "devicetree", "physmem", "bootinfo", "intent-shell", "bootloader"]
# Host-side crates are members, but a bare `cargo run` or `cargo build` must
# keep meaning the kernel: they build for the bare-metal target of
# `.cargo/config.toml`, which std code cannot target.
default-members = ["kernel", "devicetree", "physmem", "bootinfo"]
resolver = "3"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# A bare-metal kernel has no unwinder to run.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
