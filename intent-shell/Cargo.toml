[package]
name = "intent-shell"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "Host prototype of the intent shell: natural language to a validated action plan"

[lints]
workspace = true

[features]
# The conversational interface (ADR 0015). The deterministic shell and the
# recovery mode build without it.
default = ["tui"]
tui = ["dep:ratatui"]

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"], optional = true }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[[bin]]
name = "intent-shell"
path = "src/main.rs"
