[package]
name = "intent-shell"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "Host prototype of the intent shell: natural language to a validated action plan"

[lints]
workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "intent-shell"
path = "src/main.rs"
