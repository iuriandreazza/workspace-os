[toolchain]
# Pinned so the hook and CI use the same compiler, formatter and lints.
channel = "1.100.0"
# The UEFI target is for the bootloader, which is a UEFI application.
targets = ["aarch64-unknown-none-softfloat", "aarch64-unknown-uefi"]
# llvm-tools: the boot smoke test needs llvm-nm and llvm-objcopy.
components = ["rustfmt", "clippy", "llvm-tools"]
