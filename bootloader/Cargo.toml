[package]
name = "bootloader"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "UEFI bootloader: loads the kernel and hands it over with the structure of ADR 0013"

[lints]
workspace = true

[dependencies]
bootinfo = { path = "../bootinfo" }
devicetree = { path = "../devicetree" }
uefi = { version = "0.41", default-features = false, features = ["panic_handler"] }

[features]
# Hands the kernel a boot info of a major version it does not know, so the
# boot smoke test can see the kernel refuse it on the console the header names.
selftest-unknown-boot-info-version = []
# Fails the first run after the kernel is loaded and runs again, so the boot
# smoke test can see that the load range was given back.
selftest-retry-after-failure = []

[[bin]]
name = "bootloader"
path = "src/main.rs"
# The std test harness cannot link into a UEFI application.
test = false
bench = false

# Stands in for another system's EFI loader in the boot smoke test.
[[bin]]
name = "chainprobe"
path = "probe/chainprobe.rs"
test = false
bench = false

# Measures the boot model's inference time in UEFI (B1-2, ADR 0027). Never
# loaded by the bootloader.
[[bin]]
name = "inferprobe"
path = "probe/inferprobe.rs"
test = false
bench = false
